<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行与审计 · 民生智治</title>
<style>
:root{--ink:#193244;--muted:#6b7f8b;--line:#e2e9ec;--teal:#087e80;--soft:#f3f6f7}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:1500px;margin:auto;padding:28px 30px 40px}.head{margin-bottom:23px}.eyebrow{font-size:12px;color:var(--teal);font-weight:700;letter-spacing:1.2px}.head h1{font-size:27px;margin:4px 0}.head p{margin:0;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 24px #15394b08}.metric{color:var(--muted);font-size:13px}.value{font-size:25px;font-weight:700;margin-top:7px}.hint{font-size:12px;color:#81939d;margin-top:4px}.history{padding:22px;background:white;border:1px solid var(--line);border-radius:12px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.bar h2{font-size:18px;margin:0}.bar button{border:1px solid #d4e0e4;border-radius:8px;background:white;color:#345263;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf1f3;font-size:13px;white-space:nowrap}.table th{font-weight:600;color:#71848f}.empty{padding:34px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#385365;font-size:16px;margin-bottom:7px}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#eaf5f1;color:#2b806d;font-size:12px}.warning{padding:13px 15px;background:#fff8e9;border:1px solid #f1e3c5;border-radius:9px;color:#86651e;font-size:13px;margin-top:16px}@media(max-width:780px){.page{padding:20px 14px}.cards{grid-template-columns:1fr}}
</style></head><body><main class="page">
<header class="head"><div class="eyebrow">SYSTEM · AUDIT</div><h1>运行与审计</h1><p>追踪配置发布记录，并查看可审计的系统操作范围</p></header>
<section class="cards"><article class="card"><div class="metric">已发布配置版本</div><div id="versionsCount" class="value">—</div><div class="hint">来自配置版本服务</div></article><article class="card"><div class="metric">任务运行操作日志</div><div class="value">尚未接入</div><div class="hint">后端任务审计接口尚未提供</div></article><article class="card"><div class="metric">人工复核操作日志</div><div class="value">尚未接入</div><div class="hint">复核模块接入后可纳入留痕</div></article></section>
<section class="history"><div class="bar"><h2>配置发布历史</h2><button id="refresh">↻ 刷新</button></div><div class="table-wrap"><table class="table"><thead><tr><th>版本</th><th>配置名称</th><th>发布人</th><th>发布时间</th><th>状态</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">正在读取版本记录…</td></tr></tbody></table></div><div class="warning">当前系统可查询配置版本发布记录。任务启停、数据复核和空间点位调整的持久化审计能力尚未接入，页面不会用演示数据代替真实日志。</div></section>
</main><script>
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const rows=document.querySelector('#rows');rows.innerHTML='<tr><td colspan="5" class="empty">正在读取版本记录…</td></tr>';try{const r=await fetch('/api/v1/config-versions?limit=100');if(!r.ok)throw Error('版本记录读取失败');const data=await r.json();document.querySelector('#versionsCount').textContent=data.length.toLocaleString('zh-CN');rows.innerHTML=data.length?data.map(item=>`<tr><td><b>${esc(item.version)}</b></td><td>${esc(item.title)}</td><td>${esc(item.publisher)}</td><td>${esc(item.published_at?new Date(item.published_at).toLocaleString('zh-CN'):'—')}</td><td><span class="pill">已发布</span></td></tr>`).join(''):'<tr><td colspan="5" class="empty"><strong>暂无配置发布记录</strong>配置助手发布配置版本后，记录会显示在这里。</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}。请确认后端服务正常。</td></tr>`}}document.querySelector('#refresh').onclick=load;load();
</script></body></html>
