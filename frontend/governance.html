<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>治理配置 · 民生智治</title>
<style>
:root{--ink:#193244;--muted:#68808e;--line:#e1e8eb;--paper:#fff;--canvas:#f3f6f7;--teal:#087e80;--teal-soft:#e7f4f2;--blue:#3175bd;--amber:#a87219;--red:#b94e47;--shadow:0 10px 28px #18394b0b}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--canvas);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.governance-shell{height:100%;display:flex;flex-direction:column;overflow:hidden}.toolbar{padding:17px 28px 0;background:#fff;border-bottom:1px solid var(--line);flex:none}.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.eyebrow{font-size:11px;color:var(--teal);font-weight:750;letter-spacing:1.1px}.title-row h1{font-size:25px;margin:2px 0}.title-row p{font-size:14px;color:var(--muted);margin:0 0 14px}.toolbar-actions{display:flex;gap:8px;align-items:center}.body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 28px 34px}.page{max-width:1440px;margin:0 auto}.btn{height:38px;border:1px solid #d5e1e6;border-radius:8px;background:#fff;color:#355264;padding:0 13px;font-weight:600;font-size:13px}.btn:hover{background:#f7fafb}.btn.primary{border-color:var(--teal);background:var(--teal);color:#fff}.btn.soft{background:var(--teal-soft);border-color:#c7e5e0;color:#146f6c}.btn.small{height:32px;padding:0 10px;font-size:12px}.btn.danger{color:var(--red)}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionhead h2{font-size:17px;margin:0}.sectionhead p{font-size:13px;color:var(--muted);margin:3px 0 0}.notice{padding:12px 15px;background:#edf7f6;border:1px solid #d1e9e5;border-radius:9px;color:#426672;font-size:13px;margin-bottom:15px}.notice b{color:#1c6668}.grid2{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.5fr);gap:15px}.panel{padding:18px}.list{display:grid;gap:8px}.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.listrow.selected{border-color:#98d3cb;background:#f0f8f7}.listrow b{display:block;font-size:14px}.listrow small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.status{padding:4px 9px;border-radius:16px;background:#eef5f3;color:#237c68;font-size:11px;white-space:nowrap}.status.draft{background:#fff5e6;color:#986712}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650;color:#3f5b6b}.field input,.field select,.field textarea{width:100%;border:1px solid #cfdae0;border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#45aaa2;box-shadow:0 0 0 3px #138d8515}.field textarea{min-height:90px;resize:vertical}.help{font-size:12px;color:#83939d}.checkline{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:13px;color:#476170}.checkline input{width:17px;height:17px;accent-color:var(--teal)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;font-size:12px;color:#738793;background:#f7f9fa;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:9px 10px;border-bottom:1px solid #edf1f2;font-size:13px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table input,.table select{width:100%;min-width:95px;padding:7px 8px;border:1px solid #dce5e8;border-radius:6px;color:#294557;background:#fff}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.split{display:flex;gap:15px;align-items:flex-start}.split>*{flex:1;min-width:0}.steps{display:grid;gap:9px}.step{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px}.stepnum{width:29px;height:29px;border-radius:9px;background:#e9f4f3;color:var(--teal);display:grid;place-items:center;font-weight:700}.step b{font-size:14px}.step small{display:block;color:var(--muted);font-size:12px}.switch{appearance:none;width:39px;height:23px;border-radius:14px;background:#cad5d9;position:relative;cursor:pointer;transition:.15s}.switch:before{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;left:3px;top:3px;box-shadow:0 1px 3px #0002;transition:.15s}.switch:checked{background:#128b86}.switch:checked:before{left:19px}.empty{padding:26px;text-align:center;color:#81929a;border:1px dashed #d5e0e4;border-radius:9px}.tag{display:inline-block;padding:3px 8px;border-radius:12px;background:#eef5f5;color:#3d7273;font-size:11px;margin:2px}.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translate(-50%,12px);background:#193d4c;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.version-meta{font-size:12px;color:#81919a}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:14px}.kpi{padding:13px 15px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:22px;margin-top:4px}.modal{position:fixed;inset:0;background:#132d3c88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:13px;padding:20px}.modalbox h3{margin:0 0 4px}.modalbox p{margin:0 0 14px;color:var(--muted);font-size:13px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:850px){.toolbar{padding:14px 15px 0}.title-row{display:block}.toolbar-actions{margin-bottom:10px}.body{padding:14px}.grid2,.split{grid-template-columns:1fr;display:grid}.kpis{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
.profile-revision{max-width:112px;border:1px solid #d8e2e7;border-radius:6px;padding:4px;font-size:11px;color:#536b78;background:#fff}</style></head>
<body><div class="governance-shell"><header class="toolbar"><div class="title-row"><div><div class="eyebrow">GOVERNANCE CONFIGURATION</div><h1 id="page-title">治理方案</h1><p id="page-desc">组合分类、语义提取、空间匹配与质量校验规则，作为任务执行时的固定配置快照。</p></div><div class="toolbar-actions"><button class="btn" id="go-assistant">✳ 配置助手</button><button class="btn primary" id="top-save">保存配置</button></div></div></header><main class="body"><div class="page" id="content"><div class="empty">正在加载治理配置…</div></div></main></div><div class="toast" id="toast"></div><div class="modal" id="modal"><section class="modalbox" id="modalbox"></section></div>
<script>
const sections=[
 {id:'profiles',name:'治理方案',desc:'组合分类、语义提取、空间匹配与质量校验规则，作为任务执行时的固定配置快照。'},
 {id:'categories',name:'分类与标签',desc:'维护一级、二级问题分类及同义表达，支持后续从已治理数据中迭代分类体系。'},
 {id:'fields',name:'数据字段与对象',desc:'定义需要提取的字段、数据类型、对象目录和枚举项，字段可逐步扩展。'},
 {id:'extraction',name:'语义提取规则',desc:'配置标题、分类、地址、线路、站点、小区等字段的提取要求和证据约束。'},
 {id:'spatial',name:'地址与空间规则',desc:'配置北京市地址标准化、高德匹配、AI 辅助定位、置信门槛和行政区挂接。'},
 {id:'quality',name:'质量校验',desc:'配置跨字段、证据、坐标范围和空间挂接校验，以及自动通过或转人工复核的条件。'},
 {id:'versions',name:'版本管理',desc:'查看治理方案发布历史、版本快照和所引用的规则修订号。'}
];
const defaults={
 categories:{items:[]},
 fields:{items:[
  {key:'title',name:'诉求标题',type:'text',required:true,object:'文本'},
  {key:'primary_category',name:'一级问题分类',type:'category',required:true,object:'分类体系'},
  {key:'secondary_category',name:'二级问题分类',type:'category',required:true,object:'分类体系'},
  {key:'address',name:'诉求地址',type:'location',required:false,object:'地名地址'},
  {key:'metro_line',name:'关联地铁线路',type:'entity',required:false,object:'轨道线路'},
  {key:'metro_station',name:'关联地铁站点',type:'entity',required:false,object:'轨道站点'},
  {key:'community',name:'所属小区',type:'entity',required:false,object:'小区目录'}
 ]},
 extraction:{model_source:'',system_prompt:'请根据脱敏诉求内容进行结构化提取。所有字段必须提供原文证据；原文未提及的信息返回空值，不得推测。地点需区分事件发生地与诉求目标地点。',confidence_threshold:0.82,evidence_required:true},
 spatial:{provider:'高德地图 API',query_prefix:'北京市',geocode_threshold:0.88,ai_fallback:true,ai_review_threshold:0.70,ai_search_note:'仅在高德未找到或候选不确定时，搜索公开信息中的别名、隶属地点或所在建筑；证据需可追溯。',admin_levels:['省','市','区/县','乡镇/街道','村/社区'],manual_on_conflict:true},
 quality:{rules:[
  {name:'字段值须有原文依据',stage:'语义提取',condition:'每个非空提取字段均记录对应原文证据',action:'无证据字段转人工复核',enabled:true},
  {name:'地址查询限定北京市',stage:'地名匹配',condition:'查询词包含北京市且不重复添加市级前缀',action:'不满足时先标准化，再调用地名服务',enabled:true},
  {name:'坐标行政区校验',stage:'空间挂接',condition:'点位位于北京市行政边界内',action:'边界外或无法命中时转人工复核',enabled:true},
  {name:'低置信度复核',stage:'全流程',condition:'字段置信度低于阈值或多个候选冲突',action:'保留候选并进入人工复核队列',enabled:true}
 ]}
};
let current= new URLSearchParams(location.search).get('tab')||'profiles',configCache=structuredClone(defaults),revisionCache={},ruleHistory={},profiles=[],versions=[],sources=[];let toastTimer;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(!r.ok){let e='请求失败';try{e=(await r.json()).detail||e}catch{}throw Error(e)}return r.json()}
function selectTab(id){current=id;const item=sections.find(x=>x.id===id)||sections[0];$('#page-title').textContent=item.name;$('#page-desc').textContent=item.desc;$('#top-save').hidden=['profiles','versions'].includes(id);history.replaceState(null,'',`${location.pathname}?embed=1&tab=${encodeURIComponent(id)}`);render()}
function drawTabs(){ $('#go-assistant').onclick=()=>parent.postMessage({page:'对话式配置'},'*') }
async function loadAll(){try{for(const s of ['categories','fields','extraction','spatial','quality']){const result=await api('/api/v1/governance/config/'+s);if(result.revision){revisionCache[s]=result.revision;configCache[s]=result.config}else{configCache[s]=structuredClone(defaults[s]);const seeded=await api('/api/v1/governance/config/'+s,{method:'PUT',body:JSON.stringify(configCache[s])});revisionCache[s]=seeded.revision}ruleHistory[s]=await api('/api/v1/governance/config/'+s+'/revisions')}profiles=await api('/api/v1/governance/profiles');versions=await api('/api/v1/governance/profile-versions');try{sources=await api('/api/v1/data-sources')}catch{}render()}catch(e){$('#content').innerHTML=`<div class="card panel"><b>读取治理配置失败</b><p>${esc(e.message)}</p><button class="btn" onclick="loadAll()">重新加载</button></div>`}}
function saveButton(action='保存配置'){return `<button class="btn primary" data-save>${action}</button>`}
function render(){const root=$('#content');if(current==='profiles')return renderProfiles(root);if(current==='categories')return renderCategories(root);if(current==='fields')return renderFields(root);if(current==='extraction')return renderExtraction(root);if(current==='spatial')return renderSpatial(root);if(current==='quality')return renderQuality(root);if(current==='versions')return renderVersions(root)}
function renderProfiles(root){root.innerHTML=`<div class="notice"><b>治理方案是任务使用的配置组合。</b>发布时会冻结各规则模块的当前修订号和内容；后续编辑规则不会更改已发布方案。</div><div class="grid2"><section class="card panel"><div class="sectionhead"><div><h2>治理方案列表</h2><p>选择方案后可查看、编辑草稿或发布新快照</p></div><button class="btn small" id="new-profile">＋ 新建</button></div><div class="list" id="profile-list"></div></section><section class="card panel"><div class="sectionhead"><div><h2 id="profile-form-title">新建治理方案</h2><p>发布前建议先完成各子模块配置和样例验证</p></div><span class="status draft" id="profile-state">草稿</span></div><div class="formgrid"><div class="field"><label>方案名称</label><input id="profile-name" placeholder="例如：接诉即办历史数据首轮治理"></div><div class="field"><label>适用数据库连接</label><select id="profile-source"><option value="">选择已配置的数据源</option>${sources.filter(s=>s.kind==='database'&&s.enabled).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div><div class="field full"><label>用途说明</label><textarea id="profile-desc" placeholder="描述适用数据、治理目标和适用范围"></textarea></div></div><div class="sectionhead" style="margin-top:18px"><div><h2>本方案包含的规则</h2><p>发布时将把勾选模块的当前修订内容保存为不可变快照</p></div></div><div class="steps">${['categories|一级与二级分类','fields|提取字段与标注对象','extraction|模型语义提取','spatial|地址匹配与空间挂接','quality|质量校验'].map((v,i)=>{const [id,label]=v.split('|');return `<label class="step"><span class="stepnum">${i+1}</span><span><b>${label}</b><small id="rev-${id}">当前修订号：v${revisionCache[id]||0}</small></span><span class="actions"><select class="profile-revision" data-revision="${id}" aria-label="${label}规则版本">${(ruleHistory[id]||[]).map(r=>`<option value="${r.revision}">${r.revision===revisionCache[id]?'当前最新':'历史'} v${r.revision}</option>`).join('')}</select><input class="switch profile-module" type="checkbox" value="${id}" checked aria-label="包含${label}"></span></label>`}).join('')}</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" id="save-profile">保存为草稿</button><button class="btn primary" id="publish-profile">发布方案版本</button></div></section></div><section class="card panel" style="margin-top:15px"><div class="sectionhead"><div><h2>治理顺序</h2><p>阶段按记录推进，阶段状态独立保存，可从失败或变更的阶段恢复</p></div></div><div class="steps">${[['01','数据字段映射','只读读取工单及正文、主键字段'],['02','语义提取与分类','标题、一级/二级分类、地址、线路、站点、小区'],['03','地名地址匹配','先高德直匹配；失败后 AI 查找关联地点并记录依据'],['04','行政区空间挂接','根据最终点位关联省、市、区县、街道和村社区'],['05','质量检查与复核','低置信、冲突、无证据或越界结果进入复核']].map(x=>`<div class="step"><span class="stepnum">${x[0]}</span><span><b>${x[1]}</b><small>${x[2]}</small></span><span class="status">有序执行</span></div>`).join('')}</div></section>`;
 let selected=null;const list=$('#profile-list');if(!profiles.length)list.innerHTML='<div class="empty">还没有治理方案。新建方案后可组合当前各项规则。</div>';else list.innerHTML=profiles.map(p=>`<button class="listrow ${selected===p.id?'selected':''}" data-id="${p.id}" style="text-align:left;width:100%"><span><b>${esc(p.name)}</b><small>${esc(p.description||'未填写说明')}<br>${p.latest_version?`最新发布：${esc(p.latest_version.version)}`:'尚未发布'}</small></span><span class="status ${p.status==='published'?'':'draft'}">${p.status==='published'?'已发布':'草稿'}</span></button>`).join('');
 $('#new-profile').onclick=()=>{selected=null;$('#profile-name').value='';$('#profile-desc').value='';$('#profile-form-title').textContent='新建治理方案';$('#profile-state').textContent='草稿'};
 list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=profiles.find(x=>x.id===b.dataset.id);selected=p.id;$('#profile-name').value=p.name;$('#profile-desc').value=p.description||'';$('#profile-source').value=p.settings?.source_id||'';$('#profile-form-title').textContent='编辑治理方案';$('#profile-state').textContent=p.status==='published'?'已发布 · 编辑将保存为新草稿':'草稿';const keys=p.settings?.sections||Object.keys(defaults);document.querySelectorAll('.profile-module').forEach(c=>c.checked=keys.includes(c.value));const selected=p.settings?.revisions||{};document.querySelectorAll('.profile-revision').forEach(x=>x.value=selected[x.dataset.revision]||revisionCache[x.dataset.revision])});
 const save=async publish=>{const name=$('#profile-name').value.trim();if(!name){toast('请先填写方案名称');return}const selectedSections=[...document.querySelectorAll('.profile-module:checked')].map(x=>x.value);const settings={source_id:$('#profile-source').value,sections:selectedSections,revisions:Object.fromEntries([...document.querySelectorAll('.profile-revision')].filter(x=>selectedSections.includes(x.dataset.revision)).map(x=>[x.dataset.revision,+x.value]))};try{const p=await api('/api/v1/governance/profiles',{method:'POST',body:JSON.stringify({id:selected,name,description:$('#profile-desc').value,settings})});selected=p.id;profiles=await api('/api/v1/governance/profiles');if(publish){const v=await api(`/api/v1/governance/profiles/${p.id}/publish`,{method:'POST',body:JSON.stringify({publisher:'管理员'})});versions=await api('/api/v1/governance/profile-versions');toast(`已发布 ${v.version}，规则快照已固定`)}else toast('治理方案草稿已保存');renderProfiles($('#content'))}catch(e){toast(e.message)}};
 $('#save-profile').onclick=()=>save(false);$('#publish-profile').onclick=()=>save(true)
}
function renderCategories(root){const items=configCache.categories.items||[];root.innerHTML=`<div class="notice"><b>分类采用一级 / 二级结构。</b>建议先从历史工单主题归纳候选，再由业务人员校准后发布；编码应稳定，名称调整不应复用其他分类编码。</div><section class="card panel"><div class="sectionhead"><div><h2>问题分类目录</h2><p>当前配置修订 v${revisionCache.categories||0} · 一级问题和二级问题均可编辑</p></div><div class="actions"><button class="btn" id="add-cat">＋ 添加分类</button><button class="btn primary" data-save>保存分类</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>层级</th><th>分类编码</th><th>分类名称</th><th>上级分类编码</th><th>说明</th><th>别名（逗号分隔）</th><th>操作</th></tr></thead><tbody id="cat-rows">${items.length?items.map((x,i)=>`<tr data-index="${i}"><td><select data-k="level"><option ${x.level==='一级'?'selected':''}>一级</option><option ${x.level==='二级'?'selected':''}>二级</option></select></td><td><input data-k="code" value="${esc(x.code)}" placeholder="如 rail_transit"></td><td><input data-k="name" value="${esc(x.name)}" placeholder="问题分类名称"></td><td><input data-k="parent_code" value="${esc(x.parent_code||'')}" placeholder="二级分类填写"></td><td><input data-k="description" value="${esc(x.description||'')}" placeholder="分类说明"></td><td><input data-k="aliases" value="${esc((x.aliases||[]).join(', '))}" placeholder="同义表达"></td><td><button class="btn small danger" data-delete="${i}">删除</button></td></tr>`).join(''):'<tr><td colspan="7"><div class="empty">尚未维护问题分类，可从“添加分类”开始。</div></td></tr>'}</tbody></table></div><p class="help" style="margin-top:12px">子分类必须关联有效的一级分类。分类删除前请检查是否已被治理方案或历史结果引用。</p></section>`;
 $('#add-cat').onclick=()=>{const next=[...items,{level:'一级',code:'',name:'',parent_code:'',description:''}];configCache.categories.items=next;renderCategories(root)};root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{configCache.categories.items.splice(+b.dataset.delete,1);renderCategories(root)});root.querySelector('[data-save]').onclick=async()=>{const rows=[...root.querySelectorAll('#cat-rows tr[data-index]')];const next=rows.map(tr=>{const row=Object.fromEntries([...tr.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value.trim()]));row.aliases=(row.aliases||'').split(',').map(x=>x.trim()).filter(Boolean);return row});const codes=new Set();for(const x of next){if(!x.code||!x.name){toast('分类编码和名称不能为空');return}if(codes.has(x.code)){toast('分类编码不能重复');return}codes.add(x.code)}for(const x of next){if(x.level==='二级'&&(!x.parent_code||!next.some(parent=>parent.level==='一级'&&parent.code===x.parent_code))){toast('每个二级分类都必须关联一个已定义的一级分类');return}}await persist('categories',{items:next})}}
function renderFields(root){const items=configCache.fields.items||[];root.innerHTML=`<div class="notice"><b>字段是结果数据结构的定义。</b>“地铁线路、站点、小区”等对象字段可关联对象目录；仅在正文有明确证据时填值。枚举值应逐项维护，避免让模型自由创造新枚举。</div><section class="card panel"><div class="sectionhead"><div><h2>标注字段与对象目录</h2><p>当前配置修订 v${revisionCache.fields||0} · 控制结果字段、类型和必填约束</p></div><div class="actions"><button class="btn" id="add-field">＋ 添加字段</button><button class="btn primary" data-save>保存字段</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>字段键</th><th>展示名称</th><th>数据类型</th><th>对象目录 / 枚举</th><th>必填</th><th>操作</th></tr></thead><tbody>${items.map((x,i)=>`<tr data-index="${i}"><td><input data-k="key" value="${esc(x.key)}"></td><td><input data-k="name" value="${esc(x.name)}"></td><td><select data-k="type">${['text','enum','category','entity','location','date','integer','boolean'].map(v=>`<option ${x.type===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input data-k="object" value="${esc(x.object||'')}" placeholder="枚举值用逗号分隔或对象目录"></td><td><input type="checkbox" data-k="required" ${x.required?'checked':''} aria-label="必填"></td><td><button class="btn small danger" data-delete="${i}">删除</button></td></tr>`).join('')}</tbody></table></div><div class="help" style="margin-top:12px">实体对象建议维护标准名称、别名及来源目录，例如轨道线路、轨道站点、小区和行政区划。现阶段该模块先管理对象字段引用；目录数据接入可在后续版本扩展。</div></section>`;
 $('#add-field').onclick=()=>{configCache.fields.items.push({key:'',name:'',type:'text',required:false,object:''});renderFields(root)};root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{configCache.fields.items.splice(+b.dataset.delete,1);renderFields(root)});root.querySelector('[data-save]').onclick=async()=>{const next=[...root.querySelectorAll('tbody tr')].map((tr,index)=>{const o={...(items[index]||{})};tr.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type==='checkbox'?i.checked:i.value.trim());return o});const seen=new Set();for(const f of next){if(!f.key||!f.name){toast('字段键和名称不能为空');return}if(seen.has(f.key)){toast('字段键不能重复');return}seen.add(f.key)}await persist('fields',{items:next})}}
function renderExtraction(root){const c=configCache.extraction||defaults.extraction;const fieldRows=(configCache.fields.items||[]).map(f=>`<div class="step"><span class="stepnum">Aa</span><span><b>${esc(f.name)}</b><small>${esc(f.key)} · ${esc(f.type)}${f.required?' · 必填':''}</small></span><span class="status">纳入提取结构</span></div>`).join('');const modelSources=sources.filter(s=>s.kind==='model'&&s.enabled);root.innerHTML=`<div class="notice"><b>字段结构由“数据字段与对象”维护。</b>本页设置模型调用、整体指令和置信度策略；每个字段的原文证据应随结果保存，便于审核和专利方案的处理可追溯性。</div><div class="grid2"><section class="card panel"><div class="sectionhead"><div><h2>提取目标字段</h2><p>修改字段请前往数据字段与对象</p></div></div><div class="steps">${fieldRows||'<div class="empty">请先添加数据字段</div>'}</div></section><section class="card panel"><div class="sectionhead"><div><h2>模型与语义提取策略</h2><span class="status">修订 v${revisionCache.extraction||0}</span></div></div><div class="formgrid"><div class="field full"><label>模型服务</label><select id="model-source"><option value="">使用系统默认模型服务</option>${modelSources.map(s=>`<option value="${esc(s.id)}" ${c.model_source===s.id?'selected':''}>${esc(s.name)} · ${esc(s.provider)}</option>`).join('')}</select><span class="help">模型服务和密钥在“数据源管理”维护；此处仅选择已启用服务。</span></div><div class="field"><label>自动通过置信度阈值</label><input id="extract-threshold" type="number" min="0" max="1" step="0.01" value="${esc(c.confidence_threshold??0.82)}"></div><div class="field"><label>要求字段级原文证据</label><label class="checkline"><input id="evidence-required" type="checkbox" ${c.evidence_required!==false?'checked':''}>非空结果必须附证据片段</label></div><div class="field full"><label>系统提取指令</label><textarea id="system-prompt" style="min-height:180px">${esc(c.system_prompt||'')}</textarea><span class="help">不要把真实工单正文写入规则。测试时优先使用脱敏样例，并确认低置信及无证据输出进入复核。</span></div></div><div class="actions" style="justify-content:flex-end;margin-top:15px"><button class="btn primary" data-save>保存提取规则</button></div></section></div>`;root.querySelector('[data-save]').onclick=()=>{const threshold=+$('#extract-threshold').value;if(threshold<0||threshold>1){toast('置信度阈值应在 0 到 1 之间');return}persist('extraction',{model_source:$('#model-source').value,confidence_threshold:threshold,evidence_required:$('#evidence-required').checked,system_prompt:$('#system-prompt').value})}}
function renderSpatial(root){const c=configCache.spatial||defaults.spatial;root.innerHTML=`<div class="notice"><b>地址定位分级处理：</b>提取原始地址后标准化为“北京市 + 地址”，优先高德直接匹配；无结果或候选不确定时再启用 AI 搜索公开资料，使用政务中心等关联地点坐标时标记为“参照建筑定位”，不能伪装成精确门址。</div><div class="grid2"><section class="card panel"><div class="sectionhead"><div><h2>地址检索与兜底定位</h2><p>地址文本匹配规则及来源留痕</p></div><span class="status">修订 v${revisionCache.spatial||0}</span></div><div class="formgrid"><div class="field"><label>地名地址服务</label><select id="provider"><option ${c.provider==='高德地图 API'?'selected':''}>高德地图 API</option></select></div><div class="field"><label>查询地址统一前缀</label><input id="query-prefix" value="${esc(c.query_prefix||'北京市')}"><span class="help">已有“北京/北京市”时不重复添加</span></div><div class="field"><label>高德匹配自动通过阈值</label><input id="geocode-threshold" type="number" min="0" max="1" step="0.01" value="${esc(c.geocode_threshold??0.88)}"></div><div class="field"><label>AI 辅助定位阈值</label><input id="ai-threshold" type="number" min="0" max="1" step="0.01" value="${esc(c.ai_review_threshold??0.70)}"></div><div class="field full"><label>AI 辅助定位说明</label><textarea id="ai-note">${esc(c.ai_search_note||'')}</textarea><span class="help">保留搜索来源、页面标题、引用摘要、候选参照地点和坐标。无可核验依据时必须转人工复核。</span></div><label class="field full checkline"><input id="ai-fallback" type="checkbox" ${c.ai_fallback?'checked':''}>高德无结果或候选不确定时，启用 AI 辅助搜索</label><label class="field full checkline"><input id="manual-conflict" type="checkbox" ${c.manual_on_conflict!==false?'checked':''}>候选冲突、结果越界或证据不足时转人工复核</label><div class="field full"><label>高德 API 凭据</label><div class="help">API Key 暂不存入此规则配置，待接口资料提供后将接入安全密钥保存与连通性测试。</div></div></div><div class="actions" style="justify-content:flex-end;margin-top:15px"><button class="btn primary" data-save>保存地址规则</button></div></section><section class="card panel"><div class="sectionhead"><div><h2>行政区空间挂接</h2><p>匹配点坐标后，将行政区名称回填到记录</p></div></div><div class="field full"><label>需要挂接的行政区层级</label><div id="admin-levels">${['省','市','区/县','乡镇/街道','村/社区'].map(x=>`<label class="checkline"><input type="checkbox" value="${x}" ${(c.admin_levels||defaults.spatial.admin_levels).includes(x)?'checked':''}>${x}</label>`).join('')}</div></div><div class="notice" style="margin-top:12px"><b>处理原则</b><br>空间挂接以最终点位和行政区边界空间关系为依据；保留边界数据版本与坐标系，边界点或未命中结果进入复核。</div><div class="steps"><div class="step"><span class="stepnum">1</span><span><b>直接地址匹配</b><small>精确地址、POI 或地址服务候选</small></span><span class="status">高德</span></div><div class="step"><span class="stepnum">2</span><span><b>AI 关联地点定位</b><small>公开依据 + 参照建筑/设施点</small></span><span class="status draft">需留证</span></div><div class="step"><span class="stepnum">3</span><span><b>人工复核</b><small>候选冲突、低置信或证据不足</small></span><span class="status draft">待确认</span></div></div></section></div>`;root.querySelector('[data-save]').onclick=()=>{const values=id=>+$('#'+id).value;if([values('geocode-threshold'),values('ai-threshold')].some(x=>x<0||x>1)){toast('置信度阈值应在 0 到 1 之间');return}persist('spatial',{provider:$('#provider').value,query_prefix:$('#query-prefix').value.trim()||'北京市',geocode_threshold:values('geocode-threshold'),ai_review_threshold:values('ai-threshold'),ai_fallback:$('#ai-fallback').checked,manual_on_conflict:$('#manual-conflict').checked,ai_search_note:$('#ai-note').value,admin_levels:[...root.querySelectorAll('#admin-levels input:checked')].map(x=>x.value)})}}
function renderQuality(root){const rules=configCache.quality.rules||[];root.innerHTML=`<div class="notice"><b>质量规则决定自动通过还是转复核。</b>规则应分阶段检查，某阶段失败时只重跑受影响阶段；发布后规则快照绑定到治理方案。</div><section class="card panel"><div class="sectionhead"><div><h2>质量校验规则</h2><p>当前配置修订 v${revisionCache.quality||0} · 已启用规则 ${rules.filter(x=>x.enabled!==false).length} 条</p></div><div class="actions"><button class="btn" id="add-rule">＋ 添加规则</button><button class="btn primary" data-save>保存校验规则</button></div></div><div class="steps" id="quality-rules">${rules.map((r,i)=>`<div class="card panel" data-index="${i}" style="box-shadow:none;padding:13px"><div class="formgrid"><div class="field"><label>规则名称</label><input data-k="name" value="${esc(r.name)}"></div><div class="field"><label>所属阶段</label><select data-k="stage">${['全流程','语义提取','分类标引','地址标准化','地名匹配','空间挂接'].map(x=>`<option ${r.stage===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>触发条件</label><input data-k="condition" value="${esc(r.condition)}"></div><div class="field"><label>处理方式</label><input data-k="action" value="${esc(r.action)}"></div><div class="field"><label class="checkline"><input data-k="enabled" type="checkbox" ${r.enabled!==false?'checked':''}>启用此规则</label></div><div class="field" style="align-content:end"><button class="btn small danger" data-delete="${i}">删除规则</button></div></div></div>`).join('')||'<div class="empty">尚无校验规则</div>'}</div><p class="help">首版支持对规则说明进行持久化配置；服务端自动执行这些规则将在治理任务处理链路接入后启用。</p></section>`;
 $('#add-rule').onclick=()=>{configCache.quality.rules.push({name:'新质量规则',stage:'全流程',condition:'',action:'转人工复核',enabled:true});renderQuality(root)};root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{configCache.quality.rules.splice(+b.dataset.delete,1);renderQuality(root)});root.querySelector('[data-save]').onclick=()=>{const next=[...root.querySelectorAll('#quality-rules [data-index]')].map(card=>{const o={};card.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.type==='checkbox'?i.checked:i.value.trim());return o});if(next.some(x=>!x.name||!x.condition||!x.action)){toast('规则名称、触发条件和处理方式都要填写');return}persist('quality',{rules:next})}}
async function renderVersions(root){try{versions=await api('/api/v1/governance/profile-versions')}catch{}root.innerHTML=`<div class="notice"><b>发布版本为不可变快照。</b>新建任务应选择已发布的治理方案版本；规则更新后需重新发布新版本，不会改写已运行任务或历史结果。</div><section class="card panel"><div class="sectionhead"><div><h2>治理方案发布历史</h2><p>可追溯发布人、时间和各规则模块使用的修订号</p></div><button class="btn" id="reload-versions">刷新</button></div><div class="tablewrap"><table class="table"><thead><tr><th>方案名称</th><th>版本</th><th>发布时间</th><th>发布人</th><th>规则修订快照</th><th>操作</th></tr></thead><tbody>${versions.map((v,i)=>`<tr><td>${esc(v.profile_name||'')}</td><td><span class="status">${esc(v.version)}</span></td><td>${esc(v.published_at||'')}</td><td>${esc(v.publisher)}</td><td>${Object.entries(v.snapshot||{}).filter(([k])=>k!=='profile').map(([k,x])=>`<span class="tag">${esc(k)} v${esc(x.revision)}</span>`).join('')||'—'}</td><td><button class="btn small" data-view="${i}">查看快照</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">还没有已发布的治理方案版本</div></td></tr>'}</tbody></table></div></section>`;$('#reload-versions').onclick=()=>renderVersions(root);root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=versions[+b.dataset.view];$('#modalbox').innerHTML=`<h3>${esc(v.profile_name)} · ${esc(v.version)} 配置快照</h3><p>发布于 ${esc(v.published_at)} · 发布人 ${esc(v.publisher)}</p><pre style="white-space:pre-wrap;overflow:auto;max-height:55vh;background:#f6f8f9;padding:13px;border-radius:8px;font-size:12px">${esc(JSON.stringify(v.snapshot,null,2))}</pre><div class="footer"><button class="btn" id="close-modal">关闭</button></div>`;$('#modal').classList.add('open');$('#close-modal').onclick=()=>$('#modal').classList.remove('open')})}
async function persist(section,payload){try{const out=await api('/api/v1/governance/config/'+section,{method:'PUT',body:JSON.stringify(payload)});configCache[section]=payload;revisionCache[section]=out.revision;toast(`已保存，配置修订号 v${out.revision}`);render()}catch(e){toast('保存失败：'+e.message)}}
$('#top-save').onclick=()=>{const button=document.querySelector('#content [data-save]');if(button)button.click();else toast('请在方案编辑区保存或发布方案')};$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};drawTabs();selectTab(current);loadAll();
</script></body></html>
